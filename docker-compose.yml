services:
  postgres:
    image: docker.io/postgres:17-alpine
    container_name: tinker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tinker
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/init-pg.sql:/docker-entrypoint-initdb.d/init-pg.sql:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d tinker"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    image: docker.io/localstack/localstack:latest
    container_name: tinker-localstack
    restart: unless-stopped
    environment:
      - SERVICES=s3,dynamodb,sqs,sns
      - DEBUG=1
      - DATA_DIR=/tmp/localstack/data
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/tmp/localstack

  resistors-api:
    build:
      context: ./backends/resistors
      dockerfile: Dockerfile
    container_name: resistors-api
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/tinker
      - SPRING_DATASOURCE_USERNAME=dev
      - SPRING_DATASOURCE_PASSWORD=dev
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  trading-api:
    build:
      context: ./backends/trading
      dockerfile: Dockerfile
    container_name: trading-api
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/tinker
      - SPRING_DATASOURCE_USERNAME=dev
      - SPRING_DATASOURCE_PASSWORD=dev
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  tinker-react:
    build:
      context: ./frontends/tinker-react
      dockerfile: Dockerfile
    container_name: tinker-react
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontends/tinker-react:/app:z
      - /app/node_modules
    depends_on:
      - resistors
      - trading

volumes:
  postgres_data:
  localstack_data:
